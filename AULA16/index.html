<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/style.css">
    <title>Barro e Fogo - Cerâmica Artesanal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>

    <!-- INÍCIO CABEÇALHO -->
    <header class="topo">
        <div class="topo-conteudo">
            <a href="#" class="marca">Barro & Fogo</a>
            <nav class="menu">
                <a href="#pecas">Peças</a>
                <a href="#processo">Processo</a>
                <a href="#sobre">Ateliê</a>
            </nav>

            <a href="#contato" class="botao-menu">Agendar Visita</a>

        </div>

    <!-- FIM CABEÇALHO -->

    <section class="hero">
        <div class="hero-texto">
            <h1>Peças que carregam<br>a marca das mãos</h1>
            <p>Cerâmica utilitária e decorativa, torneada uma a uma e queimada em forno a lenha, em pequenos lotes.</p>
        </div>
        <div class="hero-botoes">
            <a href="#pecas" class="botao botao-preenchido">Ver peças</a>
            <a href="#sobre" class="botao botao-contorno">Conhecer o ateliê</a>
        </div>
        <div class="hero-imagem">
            <img src="https://picsum.photos/seed/barroefogo1/500/500" alt="Foto ilustrativa de uma peça de Cerâmica" class="foto-hero">
        </div>

    </section>

    <!-- FIM HERO -->
