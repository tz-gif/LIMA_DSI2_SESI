<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas!!!</title>
</head>
<body>
    <!-- Colspan - Mesclar colunas -->
     <!-- Rowspan - Mesclar linhas -->
    <table border="1">
        <thead>
            <tr>
                <th>Produto</th>
                <th colspan="2">Detalhes</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Notebook</td>
                <td>R$ 3.000,00</td>
                <td>Em estoque</td>
            </tr>
            <tr>
                <td rowspan="2">Celular</td>
                <td>R$ 2.000,00</td>
                <td>Vendido</td>
            </tr>
            <tr>
                <td>R$ 1.800,00</td>
                <td>Em estoque</td>
            </tr>
        </tbody>

    </table>
</body>
</html>
